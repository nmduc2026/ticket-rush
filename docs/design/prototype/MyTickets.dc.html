<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>TicketRush — Vé của tôi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#09090B}a:hover{color:#09090B}
.tab{height:40px;padding:0 2px;border:none;border-bottom:2px solid transparent;background:transparent;font-family:inherit;font-size:14px;color:#71717A;cursor:pointer}
.tab-on{color:#09090B;font-weight:500;border-bottom-color:#059669}
.item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #F4F4F5;text-decoration:none;color:#09090B}
.pbtn{height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid #E4E4E7;background:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;color:#09090B;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.pbtn:disabled{opacity:.5;cursor:default}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #09090B; font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; box-sizing: border-box">
<header style="height: 56px; padding: 0 16px; border-bottom: 1px solid #E4E4E7; display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<a href="Main.dc.html" aria-label="Trang chủ" style="width: 28px; height: 28px; border-radius: 6px; background: #059669; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"></path></svg></a>
<span style="font-size: 16px; font-weight: 700">TicketRush</span>
<span style="flex-grow: 1"></span>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #D1FAE5; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #065F46">AN</span>
</header>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
<h1 style="margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Vé của tôi</h1>
<label style="position: relative; display: flex; align-items: center">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Tìm vé</span>
<svg style="position: absolute; left: 12px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<input type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="Tìm theo tên sự kiện, mã vé" style="width: 100%; height: 44px; border: 1px solid #E4E4E7; border-radius: 8px; padding: 0 12px 0 36px; font-family: inherit; font-size: 14px; box-sizing: border-box; outline: none">
</label>
<div role="tablist" style="display: flex; gap: 20px; border-bottom: 1px solid #E4E4E7">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.selected}}" class="{{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="flex-grow: 1; padding: 0 16px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="TicketQR.dc.html" class="item">
<span style="width: 64px; height: 64px; border-radius: 8px; background: {{r.bg}}; position: relative; overflow: hidden; flex-shrink: 0"><span style="position: absolute; width: 48px; height: 48px; border-radius: 50%; background: {{r.ac}}; left: 26px; top: -18px"></span></span>
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1">
<span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
<span style="font-size: 13px; color: #71717A">{{r.when}}</span>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px">
<span style="font-size: 13px; font-weight: 500">{{r.seat}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #3F3F46"><span style="width: 6px; height: 6px; border-radius: 50%; background: {{r.dot}}"></span>{{r.status}}</span>
</div>
</div>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 32px 0; text-align: center; color: #71717A">Không có vé phù hợp.</p>
</sc-if>
</div>

<nav aria-label="Phân trang" style="padding: 12px 16px 20px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #F4F4F5; flex-shrink: 0">
<button type="button" class="pbtn" disabled="{{atStart}}" onClick="{{prev}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>Trước</button>
<span style="font-size: 13px; color: #71717A">Trang {{page}} / {{pageCount}}</span>
<button type="button" class="pbtn" disabled="{{atEnd}}" onClick="{{next}}">Sau<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'up', page: 1, q: '' };
  }
  renderVals() {
    const valid = { status: 'Hợp lệ', dot: '#16A34A' };
    const used = { status: 'Đã sử dụng', dot: '#A1A1AA' };
    const refunded = { status: 'Đã hoàn tiền', dot: '#A1A1AA' };
    const rock = { bg: '#0F766E', ac: '#F59E0B' };
    const autumn = { bg: '#F5F0E6', ac: '#C2410C' };
    const indie = { bg: '#14532D', ac: '#FACC15' };
    const jazz = { bg: '#1E3A8A', ac: '#F59E0B' };
    const data = {
      up: [
        { title: 'Đêm nhạc Rock Sài Gòn', when: 'T7, 15/11 · 20:00 · Nhà hát Hòa Bình', seat: 'VIP · B7', ...rock, ...valid },
        { title: 'Đêm nhạc Rock Sài Gòn', when: 'T7, 15/11 · 20:00 · Nhà hát Hòa Bình', seat: 'VIP · B8', ...rock, ...valid },
        { title: 'Hòa nhạc Mùa Thu', when: 'CN, 22/11 · 19:30 · Nhà hát Lớn', seat: 'Standard · E12', ...autumn, ...valid },
        { title: 'Hòa nhạc Mùa Thu', when: 'CN, 22/11 · 19:30 · Nhà hát Lớn', seat: 'Standard · E13', ...autumn, ...valid },
        { title: 'Live Jazz cuối tuần', when: 'T7, 13/12 · 20:30 · Phòng trà Bến Thành', seat: 'Bàn 4 · Ghế 2', ...jazz, ...valid },
        { title: 'Live Jazz cuối tuần', when: 'T7, 13/12 · 20:30 · Phòng trà Bến Thành', seat: 'Bàn 4 · Ghế 3', ...jazz, ...valid },
      ],
      past: [
        { title: 'Indie Showcase vol.4', when: 'T7, 20/09 · 19:00 · Saigon Outcast', seat: 'Phổ thông · K3', ...indie, ...used },
        { title: 'Đêm nhạc Trịnh', when: 'CN, 07/09 · 20:00 · NVH Thanh niên', seat: 'Standard · D9', ...autumn, ...used },
      ],
      refund: [
        { title: 'Lễ hội Indie Đà Lạt', when: 'CN, 29/11 · 17:00 · Đà Lạt', seat: 'Phổ thông · K3', ...indie, ...refunded },
      ],
    };
    const q = this.state.q.trim().toLowerCase();
    const list = data[this.state.tab].filter((r) => !q || (r.title + ' ' + r.seat).toLowerCase().includes(q));
    const size = 4;
    const pageCount = Math.max(1, Math.ceil(list.length / size));
    const page = Math.min(this.state.page, pageCount);
    const tabs = [['up', 'Sắp diễn ra'], ['past', 'Đã qua'], ['refund', 'Đã hoàn']].map(([k, label]) => ({
      label: label + ' (' + data[k].length + ')',
      selected: this.state.tab === k ? 'true' : 'false',
      cls: this.state.tab === k ? 'tab tab-on' : 'tab',
      pick: () => this.setState({ tab: k, page: 1 }),
    }));
    return {
      q: this.state.q,
      onSearch: (e) => this.setState({ q: e.target.value, page: 1 }),
      tabs,
      rows: list.slice((page - 1) * size, page * size),
      empty: list.length === 0,
      page, pageCount,
      atStart: page === 1,
      atEnd: page === pageCount,
      prev: () => this.setState({ page: Math.max(1, page - 1) }),
      next: () => this.setState({ page: Math.min(pageCount, page + 1) }),
    };
  }
}
</script>
</body>
</html>
